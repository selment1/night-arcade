<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101429"><title>星座の記憶 | Night Arcade</title><style>
:root{color-scheme:dark;--bg:#101429;--ink:#fff4df;--mint:#8ce6cc;--coral:#ff8066}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29314b,#101429 70%);color:var(--ink);font:16px/1.6 system-ui,sans-serif;min-height:100svh}main{max-width:590px;margin:auto;padding:22px 20px 45px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em}a{color:var(--mint)}h1{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:30px 0 12px}p{color:#c4c8d8}.tag{color:var(--coral);font-size:12px;letter-spacing:.2em}.stats{display:flex;justify-content:space-between;padding:15px 0;margin:20px 0;border-block:1px solid #ffffff20;font-size:14px}.stats strong{display:block;font-size:23px;color:var(--mint)}button,select{font:inherit;color:var(--ink);background:#232a43;border:1px solid #ffffff30;border-radius:12px;padding:12px;cursor:pointer}button:hover{background:#303c56}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:3px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:22px 0}.card{min-width:0;aspect-ratio: .87;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;padding:5px;background:linear-gradient(135deg,#28324e,#1b223c);transition:background .15s,transform .15s}.card .back{font-size:30px;color:#8b9ab9}.card.open{background:#30354c;border-color:var(--coral)}.card.matched{background:#1e433f;border-color:#8ce6cc75}.card svg{width:88%;max-height:80%;overflow:visible}.card small{font-size:clamp(10px,2.5vw,13px)}.card.matched:after{content:'✓';position:absolute;top:1px;right:6px;color:var(--mint);font-size:12px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls label{font-size:13px}.controls select{padding:10px}.controls button{margin-left:auto;font-size:14px}#result{padding:18px;border:1px solid var(--mint);border-radius:16px;background:#17322f;margin:20px 0}#result[hidden]{display:none}#result h2{font-size:23px;margin:0}#result p{margin-bottom:0}#status{min-height:2em;font-size:14px;color:var(--mint)}footer{font-size:12px;color:#909ab6;margin-top:24px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style>
<main><header><a href="../index.html">← アーケード</a><span>NIGHT ARCADE / 03</span></header><h1>星座の記憶</h1><span class="tag">A QUIET SKY, TWO OF A KIND</span><p>星図を2枚めくって、同じ星座を見つけよう。時間制限はありません。小さな夜空を、ゆっくり覚えて。</p><div class="controls"><label for="difficulty">星の数</label><select id="difficulty"><option value="6">6組・やさしい</option><option value="8">8組・ふつう</option></select><button id="restart">新しい星空</button></div><div class="stats"><div>見つけた星座<strong id="pairs">0 / 6</strong></div><div>めくった組数<strong id="turns">0</strong></div><div>最少記録<strong id="best">—</strong></div></div><div id="board" aria-label="星座カード"></div><div id="result" hidden role="status"><h2>夜空が、ひとつになった。</h2><p id="summary"></p></div><p id="status" role="status" aria-live="polite">好きなカードを2枚選んでください。</p><p id="storage-note" hidden role="status" style="font-size:12px;color:#c4c8d8">このブラウザでは記録を保存できません。記録はこのページを開いている間のみ保持されます。</p><footer>Tab で選び、Enter / Space でめくれます。星図はこのゲームのための創作です。記録はこの端末に保存されます。</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const stars=[{name:'こぶね',p:[[14,48],[32,63],[64,63],[86,48],[14,48],[50,18],[50,48]]},{name:'かぎ',p:[[18,25],[38,15],[51,32],[34,47],[18,25],[34,47],[71,77],[83,65]]},{name:'つばさ',p:[[10,24],[30,35],[50,69],[70,35],[90,24],[71,63],[50,69],[29,63],[10,24]]},{name:'しずく',p:[[50,12],[23,49],[29,73],[50,83],[71,73],[77,49],[50,12]]},{name:'こねこ',p:[[20,76],[20,25],[37,43],[63,43],[80,25],[80,76],[20,76]]},{name:'はな',p:[[50,17],[64,39],[87,48],[64,61],[50,84],[36,61],[13,48],[36,39],[50,17]]},{name:'ほうき',p:[[17,80],[52,43],[55,17],[83,45],[52,43],[70,30]]},{name:'やま',p:[[10,75],[35,21],[52,54],[66,35],[90,75],[10,75]]}];let count=6,deck=[],selected=[],matched=new Set(),turns=0,locked=false,timer=null,round=0,best=0;function storageUnavailable(){$('storage-note').hidden=false}const sessionBest={};function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){round++;clearTimeout(timer);count=Number($('difficulty').value);deck=shuffle([...Array(count).keys(),...Array(count).keys()]);selected=[];matched=new Set();turns=0;locked=false;best=sessionBest[count]||0;try{const stored=Number(localStorage.getItem('night-memory-best-'+count));if(Number.isSafeInteger(stored)&&stored>=count)best=stored}catch{storageUnavailable()}$('result').hidden=true;$('status').textContent='好きなカードを2枚選んでください。';$('board').replaceChildren();deck.forEach((v,i)=>{const b=document.createElement('button');b.className='card';b.onclick=()=>flip(i);$('board').append(b)});render()}function picture(s){return `<svg viewBox="0 0 100 100" aria-hidden="true"><polyline points="${s.p.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#8ce6cc" stroke-width="1.8"/>${s.p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="#fff4df"/>`).join('')}</svg><small>${s.name}</small>`}function render(){[...$('board').children].forEach((b,i)=>{const match=matched.has(i),open=match||selected.includes(i);b.className='card'+(match?' matched':open?' open':'');b.innerHTML=open?picture(stars[deck[i]]):'<span class="back" aria-hidden="true">✧</span>';b.setAttribute('aria-label',`${i+1}枚目：${open?stars[deck[i]].name+(match?'、発見済み':''):'裏向き'}`);b.setAttribute('aria-disabled',String(match||selected.includes(i)||locked))});$('pairs').textContent=`${matched.size/2} / ${count}`;$('turns').textContent=turns;$('best').textContent=best?`${best} 組`:'—'}function flip(i){if(locked||matched.has(i)||selected.includes(i))return;selected.push(i);if(selected.length===1){$('status').textContent=`「${stars[deck[i]].name}」を見つけました。もう1枚選んでください。`;render();return}turns++;const[a,b]=selected;if(deck[a]===deck[b]){matched.add(a);matched.add(b);selected=[];$('status').textContent=`「${stars[deck[i]].name}」がそろいました！`;if(matched.size===deck.length){if(!best||turns<best){best=turns;sessionBest[count]=best;try{localStorage.setItem('night-memory-best-'+count,best)}catch{storageUnavailable()}}$('result').hidden=false;$('summary').textContent=`${turns} 組めくって、${count} つの星座を発見。${turns===count?'一度も間違えずにクリア！':'もう一度遊ぶなら「新しい星空」へ。'}`;$('status').textContent='すべての星座がそろいました。クリア！'}render()}else{locked=true;$('status').textContent='違う星座でした。位置を覚えて、もう一度。';render();const token=round;timer=setTimeout(()=>{if(token!==round)return;selected=[];locked=false;render();$('status').textContent='次の2枚を選んでください。'},1100)}}$('restart').onclick=start;$('difficulty').onchange=start;start()})();
</script></html>
