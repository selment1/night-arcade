<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101429"><title>プリズム回廊 | Night Arcade</title><style>
:root{color-scheme:dark;--bg:#101429;--ink:#fff4df;--mint:#8ce6cc;--coral:#ff8066}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#24324a,var(--bg) 65%);color:var(--ink);font:16px/1.6 system-ui,sans-serif;min-height:100svh}main{max-width:580px;margin:auto;padding:22px 20px 45px}a{color:var(--mint)}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em}h1{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:30px 0 12px}p{color:#c4c8d8}small{color:#c4c8d8}.tag{color:var(--coral);font-size:12px;letter-spacing:.2em}.stats{display:flex;justify-content:space-between;padding:15px 0;margin:10px 0;border-block:1px solid #ffffff20;font-size:14px}.stats strong{display:block;font-size:23px;color:var(--mint)}#board{display:grid;gap:7px;margin:25px 0;background:#0b0e1d;padding:12px;border-radius:24px;position:relative}button{font:inherit;cursor:pointer;color:var(--ink);border:1px solid #ffffff25;background:#232a43;border-radius:12px;padding:12px}button:hover{background:#303c56}button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:3px}.tile{padding:0;aspect-ratio:1;position:relative;min-width:0;transition:background .15s}.tile svg{width:100%;height:100%;display:block}.tile.lit{background:#244c48;border-color:var(--mint)}.tile .pipe{stroke:#61728d;stroke-width:9;stroke-linecap:round;fill:none}.tile.lit .pipe{stroke:var(--mint);filter:drop-shadow(0 0 3px #8ce6cc70)}.tile .dot{fill:#ff8066}.controls{display:flex;gap:9px;flex-wrap:wrap}.controls button{flex:1;white-space:nowrap;font-size:14px}.primary{background:var(--mint);color:#101429;font-weight:700}.primary:hover{background:#b2f7e3}#result{padding:17px;border:1px solid var(--mint);border-radius:16px;background:#17322f;margin-bottom:18px}#result[hidden]{display:none}#result h2{margin:0;font-size:23px}#result p{margin:7px 0 15px}#status{min-height:2em;font-size:14px;color:var(--mint)}.legend{display:flex;justify-content:space-between;font-size:13px;color:#c4c8d8}footer{margin-top:24px;font-size:12px;color:#909ab6}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style>
<main><header><a href="../index.html">← アーケード</a><span>NIGHT ARCADE / 02</span></header><h1>プリズム回廊</h1><span class="tag">TURN THE DARK INTO LIGHT</span><p>タイルを回して、左上の入口から右下の出口まで光をつなごう。すべてのタイルを通る必要はありません。</p><div class="stats"><div>ステージ<strong id="level">1 / 6</strong></div><div>回した回数<strong id="moves">0</strong></div><div>最高到達<strong id="best">—</strong></div></div><div class="legend"><span>↘ 左上：入口（左側）</span><span>右下：出口（右側）↗</span></div><div id="board" aria-label="光のパズル"></div><div id="result" hidden role="status"><h2>光が届いた！</h2><p id="summary"></p><button class="primary" id="next">次のステージへ →</button></div><p id="status" role="status" aria-live="polite">タイルをタップすると右に90度回転します。</p><div class="controls"><button id="restart">この面をやり直す</button><button id="hint">ヒント（＋3回）</button></div><p id="storage-note" hidden role="status" style="font-size:12px;color:#c4c8d8">このブラウザでは記録を保存できません。記録はこのページを開いている間のみ保持されます。</p><footer>キーボード：Tab でタイルを選び、Enter / Space で回転。記録はこの端末に保存されます。</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),board=$('board');let stage=0,size=3,moves=0,tiles=[],solution=[],won=false,best=0,tilesReadyAt=0;function storageUnavailable(){$('storage-note').hidden=false}try{const stored=Number(localStorage.getItem('night-prism-best'));if(Number.isInteger(stored)&&stored>=0&&stored<=6)best=stored}catch{storageUnavailable()}let seed=1;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const dirs=[[-1,0],[0,1],[1,0],[0,-1]];function edges(t){return t.type===0?[t.rot%4,(t.rot+2)%4]:[t.rot%4,(t.rot+1)%4]}function orientation(a,b){for(let type=0;type<2;type++)for(let rot=0;rot<4;rot++){const e=edges({type,rot});if(e.includes(a)&&e.includes(b))return{type,rot}}}function setup(){seed=907+stage*839;size=3+Math.floor(stage/2);moves=0;won=false;solution=Array(size*size).fill(null);let path=[0],r=0,c=0;while(r<size-1||c<size-1){if(c===size-1||(r<size-1&&random()<.5))r++;else c++;path.push(r*size+c)}path.forEach((idx,k)=>{const prev=k?path[k-1]:-1,next=k<path.length-1?path[k+1]:-1;const a=k===0?3:prev===idx-1?3:0,b=k===path.length-1?1:next===idx+1?1:2;solution[idx]=orientation(a,b)});tiles=solution.map(s=>({type:s?s.type:Math.floor(random()*2),rot:Math.floor(random()*4)}));$('result').hidden=true;$('hint').disabled=false;$('level').textContent=`${stage+1} / 6`;$('status').textContent='タイルをタップすると右に90度回転します。';board.style.gridTemplateColumns=`repeat(${size},1fr)`;board.replaceChildren();tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';b.dataset.index=i;b.addEventListener('click',()=>rotate(i));board.append(b)});draw();if(trace().success){tiles[0].rot=(tiles[0].rot+1)%4;draw()}}function trace(){const seen=new Set();let i=0,entry=3;while(true){if(seen.has(i))return{seen,success:false};const e=edges(tiles[i]);if(!e.includes(entry))return{seen,success:false};seen.add(i);const exit=e.find(d=>d!==entry);if(i===size*size-1&&exit===1)return{seen,success:true};const r=Math.floor(i/size)+dirs[exit][0],c=i%size+dirs[exit][1];if(r<0||c<0||r>=size||c>=size)return{seen,success:false};i=r*size+c;entry=(exit+2)%4}}function draw(){const t=trace();[...board.children].forEach((b,i)=>{const e=edges(tiles[i]);const pts=[[50,0],[100,50],[50,100],[0,50]];b.classList.toggle('lit',t.seen.has(i));b.setAttribute('aria-label',`${Math.floor(i/size)+1}行${i%size+1}列：${e.map(d=>['上','右','下','左'][d]).join('と')}を接続${t.seen.has(i)?'、点灯中':''}`);b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><path class="pipe" d="M${pts[e[0]].join(' ')} L50 50 L${pts[e[1]].join(' ')}"/>${i===0||i===size*size-1?'<circle class="dot" cx="50" cy="50" r="8"/>':''}</svg>`;b.disabled=won});$('moves').textContent=moves;$('best').textContent=best?`${best} / 6`:'—'}function check(){if(trace().success){won=true;best=Math.max(best,stage+1);try{localStorage.setItem('night-prism-best',best)}catch{storageUnavailable()}$('result').hidden=false;$('summary').textContent=`ステージ ${stage+1} を ${moves} 回でクリア。${stage===5?'全6面クリア！夜の回廊に光が戻りました。':'次はまた違う光の道へ。'}`;$('next').textContent=stage===5?'最初からもう一度 →':'次のステージへ →';$('status').textContent='クリア！次のステージへ進めます。';$('hint').disabled=true;draw()}}function rotate(i){if(won||performance.now()<tilesReadyAt)return;tiles[i].rot=(tiles[i].rot+1)%4;moves++;draw();check()}$('restart').onclick=setup;$('next').onclick=()=>{stage=(stage+1)%6;setup();tilesReadyAt=performance.now()+300};$('hint').onclick=()=>{if(won)return;const i=solution.findIndex((s,i)=>s&&!edges(s).every(d=>edges(tiles[i]).includes(d)));if(i>=0){tiles[i].rot=solution[i].rot;moves+=3;$('status').textContent=`${Math.floor(i/size)+1}行${i%size+1}列を正しい向きにしました。`;draw();check()}};setup();})();
</script></html>
