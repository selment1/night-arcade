<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c30"><title>どうぶつタワー — NIGHT ARCADE</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c30;color:#fff5df;font-family:system-ui,sans-serif}main{max-width:600px;margin:auto;padding:18px 14px 30px}a{color:#a7e7cf}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:16px 0 8px}.tag{font-size:11px;letter-spacing:3px;color:#a7e7cf}.intro{font-size:13px;line-height:1.7;color:#c5cedb}.stats{display:flex;justify-content:space-between;margin:16px 0 10px;font-weight:700}.stage{position:relative;overflow:hidden;border-radius:22px;background:#18283f;border:1px solid #415066}canvas{display:block;width:100%;height:auto;touch-action:none}.status{min-height:52px;font-size:14px;line-height:1.6;padding:12px 2px;margin:0;color:#a7e7cf}button,select{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 15px;background:#a7e7cf;color:#101c30;cursor:pointer;min-height:44px}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffae87;outline-offset:3px}.secondary{background:#293b53;color:#fff5df}.controls{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.drop{background:#ff9d86}.aim{display:flex;gap:14px;align-items:center;font-size:13px;margin:8px 0 16px}input{width:100%;accent-color:#a7e7cf;min-height:32px}.settings{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.overlay{position:absolute;inset:0;background:#101c30df;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.overlay[hidden]{display:none}.overlay h2{font-size:28px}.overlay p{line-height:1.8}.help{font-size:13px;line-height:1.9;color:#c5cedb}.note{font-size:12px;color:#b8c4d3}@media(max-width:360px){main{padding:12px 10px}h1{font-size:22px}button,select{padding:11px}}
</style></head><body><main><header><a href="../index.html">← ゲーム一覧</a><span class="tag">BALANCE / 03</span></header><h1>どうぶつタワー</h1><p class="intro">そっと落として、ぐらぐら積もう。<br>ひとつでも台から落ちたら、おしまい。</p><div class="stats"><span>積み上げ <b id="score">0</b> 匹</span><span>ベスト <b id="best">0</b> 匹</span></div><div class="stage"><canvas id="board" width="480" height="660" aria-label="どうぶつを積み上げる物理ゲーム。下の位置スライダーと回転、落とすボタンで操作できます。"></canvas><div class="overlay" id="overlay" hidden><div><h2 id="title"></h2><p id="result"></p><button id="resume">つづける</button></div></div></div><p class="status" id="status" role="status" aria-live="polite"></p><label class="aim">落とす位置 <input id="aim" type="range" min="45" max="435" value="240" aria-label="どうぶつを落とす左右位置"></label><div class="controls"><button id="rotate" class="secondary">↻ 回転 15°</button><button id="drop" class="drop">↓ 落とす</button></div><div class="settings"><button id="pause" class="secondary">一時停止</button><button id="restart" class="secondary">はじめから</button><select id="mode" aria-label="プレイ人数"><option value="1">1人で挑戦</option><option value="2">2人で交互に</option></select></div><details class="help"><summary>遊び方・操作</summary><p>位置をスライダー、画面のタップ、または ← → キーで決めます。「回転」または R キーで向きを変え、「落とす」または Space キーで落下。どうぶつが落ち着くまで、次は落とせません。形と重さはどうぶつごとに違います。</p><p>1匹でも台の下の点線を越えると終了。2人モードは同じ端末で交互に操作し、落とした手番の人が負けです。画面を離れると自動で一時停止します。最高記録はこのブラウザーに保存します。</p></details><p class="note" id="saveNote"></p></main><script src="../vendor/matter.min.js"></script><script src="../pet-core.js"></script><script>
(()=>{'use strict';const {Engine,Bodies,Body,Composite}=Matter;const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');const engine=Engine.create({enableSleeping:true});engine.gravity.y=1;const platform=Bodies.rectangle(240,600,278,24,{isStatic:true,friction:1,label:'platform'});let animals=[],preview=null,angle=0,aim=240,score=0,best=0,phase='ready',paused=false,quiet=0,camera=0,turn=1,mode=1,last=0,acc=0,runId='',rewarded=false;const species=[{name:'くま',color:'#d9aa7c',w:64,h:60,kind:'box'},{name:'ねこ',color:'#ffbca4',w:62,h:55,kind:'box'},{name:'パンダ',color:'#e9eee5',w:70,h:63,kind:'oct'},{name:'ひよこ',color:'#f7d778',w:54,h:51,kind:'oct'},{name:'カエル',color:'#a7e7cf',w:78,h:49,kind:'box'}];try{best=Number(localStorage.getItem('night-stack-best'))||0}catch{$('saveNote').textContent='保存できない環境です。記録はこの画面の間だけ保持します。'}$('best').textContent=best;
function say(t){$('status').textContent=t}function highest(){return animals.length?Math.min(...animals.map(a=>a.body.bounds.min.y)):588}function newPreview(){const s=species[Math.floor(Math.random()*species.length)];preview={...s,x:aim,y:Math.min(455,highest()-92)};angle=0;camera=Math.min(0,preview.y-85);phase='ready';say((mode===2?`プレイヤー ${turn} の番。`:'')+`${preview.name}を置く場所を決めよう。`);sync()}
function sync(){for(const id of ['drop','rotate','aim'])$(id).disabled=paused||phase!=='ready';$('pause').disabled=phase==='over';$('pause').textContent=paused?'再開':'一時停止'}
function reset(){runId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();rewarded=false;Composite.clear(engine.world,false);Engine.clear(engine);Composite.add(engine.world,platform);animals=[];score=0;turn=1;quiet=0;paused=false;acc=0;$('score').textContent=0;$('overlay').hidden=true;newPreview()}
function drop(){if(paused||phase!=='ready')return;const p=preview;const options={friction:.85,frictionStatic:1,restitution:.02,density:.0018,sleepThreshold:60,angle};let body=p.kind==='oct'?Bodies.polygon(p.x,p.y,8,p.w/2,options):Bodies.rectangle(p.x,p.y,p.w,p.h,{...options,chamfer:{radius:7}});if(p.kind==='oct')Body.scale(body,1,p.h/p.w);body.label='animal';animals.push({body,look:p});Composite.add(engine.world,body);preview=null;phase='settling';quiet=0;say('ゆっくり…どうぶつが落ち着くまで待ってね。');sync()}
function gameOver(){phase='over';let rewardText='';if(score>0&&!rewarded&&window.NightPet){rewarded=true;try{const coins=Math.min(40,score*3),xp=Math.min(30,score*2);const r=NightPet.reward({game:'stack',id:runId,coins,xp});rewardText=r?.ok&&!r.duplicate?` おうちのペットに ${r.coins} コイン・${r.xp} XP！`:r?.duplicate?' この挑戦の報酬は受け取り済みです。':' ペットへの報酬を保存できませんでした。';if(r?.persistent===false)rewardText+=' 報酬を保存できませんでした。この画面の間だけ保持されます。';}catch{rewardText=' ペットへの報酬を保存できませんでした。'}}if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('night-stack-best',String(best))}catch{$('saveNote').textContent='記録の保存に失敗しました。ベスト記録はこの画面の間だけ保持します。'}}$('title').textContent='あっ、落ちちゃった！';$('result').textContent=`${score} 匹積めました。`+(mode===2?` プレイヤー ${turn} の負け。`:'もう一度、バランスに挑戦しよう。')+rewardText;$('resume').textContent='もう一度';$('overlay').hidden=false;say('ゲーム終了。もう一度ボタンで再挑戦できます。');sync()}
function pause(){if(phase==='over')return;paused=!paused;$('overlay').hidden=!paused;$('title').textContent='ひと休み';$('result').textContent='タワーはそのまま。準備ができたら再開しよう。';$('resume').textContent='つづける';acc=0;sync()}
function update(){Engine.update(engine,1000/60);if(animals.some(a=>a.body.position.y>660)){gameOver();return}if(phase==='settling'){const calm=animals.every(a=>a.body.speed<.22&&Math.abs(a.body.angularVelocity)<.012);quiet=calm?quiet+1:0;if(quiet>=45){score=animals.length;$('score').textContent=score;if(mode===2)turn=turn===1?2:1;newPreview()}}}
function animal(x,y,a,s,ghost=false){ctx.save();ctx.translate(x,y-camera);ctx.rotate(a);ctx.globalAlpha=ghost?.72:1;ctx.fillStyle=s.color;ctx.strokeStyle='#101c30';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(-s.w/2,-s.h/2,s.w,s.h, s.kind==='oct'?18:9);ctx.fill();ctx.stroke();if(['くま','パンダ','ねこ'].includes(s.name)){for(const v of [-1,1]){ctx.fillStyle=s.name==='パンダ'?'#344057':s.color;ctx.beginPath();if(s.name==='ねこ'){ctx.moveTo(v*22,-17);ctx.lineTo(v*26,-36);ctx.lineTo(v*10,-24)}else ctx.arc(v*21,-s.h/2+2,10,0,Math.PI*2);ctx.fill();ctx.stroke()}}for(const v of [-1,1]){if(s.name==='パンダ'){ctx.fillStyle='#344057';ctx.beginPath();ctx.ellipse(v*13,-3,8,10,-v*.3,0,Math.PI*2);ctx.fill()}ctx.fillStyle=s.name==='パンダ'?'white':'#243045';ctx.beginPath();ctx.arc(v*12,-3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f28e87';ctx.beginPath();ctx.ellipse(v*21,8,5,3,0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#243045';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,5,7,0,Math.PI);ctx.stroke();if(s.name==='ひよこ'){ctx.fillStyle='#ea9552';ctx.beginPath();ctx.moveTo(-5,3);ctx.lineTo(5,3);ctx.lineTo(0,9);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,480,660);ctx.fillStyle='#1c3048';for(let y=20;y<660;y+=45){for(let x=25;x<480;x+=45){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}}ctx.fillStyle='#364d61';ctx.fillRect(118,612-camera,16,90);ctx.fillRect(346,612-camera,16,90);ctx.fillStyle='#a7e7cf';ctx.beginPath();ctx.roundRect(101,588-camera,278,24,8);ctx.fill();ctx.strokeStyle='#ff9d8655';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(0,650-camera);ctx.lineTo(480,650-camera);ctx.stroke();ctx.setLineDash([]);for(const a of animals)animal(a.body.position.x,a.body.position.y,a.body.angle,a.look);if(preview){ctx.strokeStyle='#a7e7cf55';ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(aim,preview.y+40-camera);ctx.lineTo(aim,588-camera);ctx.stroke();ctx.setLineDash([]);animal(aim,preview.y,angle,preview,true)}if(camera<0){ctx.fillStyle='#c5cedb';ctx.font='13px system-ui';ctx.fillText('↑ タワーに合わせて画面が上へ移動',16,642)}}
function frame(now){const dt=Math.min(50,now-last||16.67);last=now;if(!paused&&phase!=='over'){acc+=dt;while(acc>=1000/60){update();acc-=1000/60;if(phase==='over')break}}draw();requestAnimationFrame(frame)}
$('drop').onclick=drop;$('rotate').onclick=()=>{if(!paused&&phase==='ready')angle=(angle+Math.PI/12)%(Math.PI*2)};$('aim').oninput=()=>{aim=Number($('aim').value);if(preview)preview.x=aim};canvas.onpointerdown=e=>{if(paused||phase!=='ready')return;const r=canvas.getBoundingClientRect();aim=Math.max(45,Math.min(435,(e.clientX-r.left)*480/r.width));$('aim').value=aim;preview.x=aim};$('pause').onclick=pause;$('resume').onclick=()=>phase==='over'?reset():pause();$('restart').onclick=reset;$('mode').onchange=()=>{mode=Number($('mode').value);reset()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&phase!=='over')pause()});window.addEventListener('pagehide',()=>{if(!paused&&phase!=='over')pause()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();drop()}if(e.key.toLowerCase()==='r')$('rotate').click();if(['ArrowLeft','ArrowRight'].includes(e.key)&&phase==='ready'&&!paused){e.preventDefault();aim=Math.max(45,Math.min(435,aim+(e.key==='ArrowLeft'?-10:10)));$('aim').value=aim;preview.x=aim}});reset();requestAnimationFrame(frame);
})();</script></body></html>
