<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふたりのオセロ | Night Arcade</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101429;color:#fff4df;font:16px/1.6 system-ui}main{max-width:650px;margin:auto;padding:20px 12px}a{color:#8ce6cc}h1{font-size:34px;margin-bottom:0}p{color:#c4c8d8}button{font:inherit;color:#fff4df;background:#28324e;border:1px solid #ffffff40;border-radius:10px;padding:10px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ff8066;outline-offset:1px}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;background:#0b272b;padding:6px;border-radius:12px;margin:20px 0}#board button{min-width:0;aspect-ratio:1;padding:0;border-radius:4px;background:#214842;display:grid;place-items:center;position:relative}#board button.legal:after{content:'+';color:#8ce6cc;font-size:22px}#board .disc{width:79%;height:79%;border-radius:50%;box-shadow:0 3px 3px #0008}#board .black{background:#151927;border:2px solid #7e8ca8}#board .white{background:#fff4df;border:2px solid #fff}#board .last{outline:2px solid #ff8066;outline-offset:-3px}#status{min-height:3.3em;color:#8ce6cc}.counts{display:flex;justify-content:space-between;font-size:20px;margin-top:20px}small{color:#b3bed1}#storage{font-size:13px;color:#ff8066}
</style><main><a href="../index.html">← アーケード</a><h1>ふたりのオセロ</h1><p>同じ端末で交互に対戦。黒が先手です。相手の石を縦・横・斜めにはさむと、自分の色に変わります。＋が置ける場所。置けない場合は自動でパスし、両者とも置けなければ終了です。</p><div class="controls"><button id="undo">一手戻す</button><button id="rotate">盤面を回転</button><button id="restart">最初から</button></div><div class="counts"><span id="black"></span><span id="white"></span></div><p id="status" role="status" aria-live="polite"></p><div id="board" aria-label="オセロ盤"></div><p id="storage" hidden>この環境では対局を保存できません。</p><small>Tab または矢印キーで移動、Enter / Space で置きます。対局はこの端末に自動保存。ネット対戦・コンピューター対戦ではありません。</small></main><script src='../pet-core.js'></script><script type="module">
import{initial,moves,play}from'./reversi-engine.js';const $=id=>document.getElementById(id),key='night-reversi-v1';let b=initial(),turn=1,last=-1,ended=false,history=[],rotated=false,notice='',matchId=crypto.randomUUID(),rewardReady=true,rewardWarning=false;
const valid=s=>s&&Array.isArray(s.b)&&s.b.length===64&&s.b.every(v=>[0,1,2].includes(v))&&[1,2].includes(s.turn)&&Number.isInteger(s.last)&&s.last>=-1&&s.last<64&&typeof s.ended==='boolean';
try{const s=JSON.parse(localStorage.getItem(key));if(valid(s)&&Array.isArray(s.history)&&s.history.length<=60&&s.history.every(valid)){b=s.b;turn=s.turn;last=s.last;ended=s.ended;history=s.history;matchId=typeof s.matchId==='string'&&s.matchId.length>=4&&s.matchId.length<=150?s.matchId:matchId;notice='保存した対局を再開しました。';const m=moves(b,turn);if(!m.length){if(moves(b,3-turn).length){turn=3-turn;notice+=' 置けないため自動パス。';ended=false}else ended=true}else ended=false;if(s.matchId!==matchId){rewardReady=false;save()}}}catch{$('storage').hidden=false}
function snapshot(){return{b:b.slice(),turn,last,ended}}function save(){try{localStorage.setItem(key,JSON.stringify({...snapshot(),history,matchId}));rewardReady=true;$('storage').hidden=true}catch{$('storage').hidden=false;return false}award();return true}
// A saved terminal match may outlive an interrupted pet save; its stable ID deduplicates recovery.
function award(){if(ended&&rewardReady&&window.NightPet){const earned=window.NightPet.reward({game:'reversi',id:matchId,coins:30,xp:20});if(earned&&!earned.duplicate){notice=' お世話コイン +'+earned.coins+'！';if(earned.persistent===false)rewardWarning=true}}}
award();
// Keep unsaved earnings visible through undo/replay and new matches until pet storage recovers.
function renderStatus(){if(rewardWarning&&window.NightPet?.snapshot().storageOK)rewardWarning=false;const diff=b.filter(x=>x===1).length-b.filter(x=>x===2).length;$('status').textContent=(ended?`終局！ ${diff===0?'引き分け':diff>0?'黒の勝ち':'白の勝ち'}。${notice}`:`${notice} ${turn===1?'● 黒':'○ 白'}の番です。`)+(rewardWarning?' 報酬を保存できませんでした。この画面の間だけ保持され、画面を閉じると失われます。':'')}
window.addEventListener('pet:change',renderStatus);
function draw(focus){const legal=moves(b,turn);$('black').textContent='● 黒 '+b.filter(x=>x===1).length;$('white').textContent='○ 白 '+b.filter(x=>x===2).length;renderStatus();$('undo').disabled=!history.length;$('board').replaceChildren();for(let n=0;n<64;n++){const i=rotated?63-n:n,btn=document.createElement('button');btn.dataset.index=i;btn.className=(legal.includes(i)&&!ended?'legal ':'')+(i===last?'last':'');btn.setAttribute('aria-label',`${(i>>3)+1}行 ${i%8+1}列：${b[i]===1?'黒':b[i]===2?'白':legal.includes(i)&&!ended?'置けます':'空き'}`);btn.setAttribute('aria-disabled',String(ended||!legal.includes(i)));if(b[i]){const d=document.createElement('span');d.className='disc '+(b[i]===1?'black':'white');btn.append(d)}btn.onclick=()=>{if(ended)return;const result=play(b,i,turn);if(!result)return;history.push(snapshot());b=result.board;turn=result.turn;last=i;ended=result.ended;notice=result.pass?`${turn===1?'白':'黒'}は置けないためパスしました。`:'';if(!save())award();draw(i)};btn.onkeydown=e=>{const deltas={ArrowLeft:-1,ArrowRight:1,ArrowUp:-8,ArrowDown:8};if(e.key in deltas){e.preventDefault();const j=n+deltas[e.key];if(j>=0&&j<64)$('board').children[j].focus()}};$('board').append(btn)}if(focus!==undefined)$('board').querySelector(`[data-index="${focus}"]`)?.focus()}
$('undo').onclick=()=>{if(history.length&&!rewardReady&&!save()){notice='保存できないため、一手戻す操作はまだ行っていません。';draw();return}const s=history.pop();if(!s)return;b=s.b;turn=s.turn;last=s.last;ended=s.ended;notice='一手戻しました。';save();draw()};$('rotate').onclick=()=>{rotated=!rotated;draw()};$('restart').onclick=()=>{if(history.length&&!confirm('対局を最初からやり直しますか？'))return;if(!rewardReady&&!save()){notice='保存できないため、新しい対局はまだ始めていません。';draw();return}b=initial();turn=1;last=-1;ended=false;history=[];notice='';matchId=crypto.randomUUID();save();draw()};draw();
</script></html>
