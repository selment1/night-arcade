<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶の設計図 | Night Arcade</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29314b,#101429 70%);color:#fff4df;font:16px/1.6 system-ui}main{max-width:620px;margin:auto;padding:20px 14px 40px}h1{font-size:34px;margin-bottom:4px}a{color:#8ce6cc}p{color:#c4c8d8}button,select{font:inherit;color:#fff4df;background:#26314b;border:1px solid #ffffff40;border-radius:10px;padding:10px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ff8066;outline-offset:2px}button[aria-pressed=true]{border:3px solid #8ce6cc;padding:8px}.controls,.palette{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stats{display:flex;gap:16px;flex-wrap:wrap;border-block:1px solid #fff3;margin:18px 0;padding:12px 0}.stats strong{color:#8ce6cc}#board{display:grid;gap:7px;margin:20px 0}#board button{min-width:0;aspect-ratio:1;position:relative;font-size:clamp(18px,6vw,29px);padding:3px}#board small{display:block;font-size:11px;color:#fff4df}#board .order{position:absolute;top:1px;left:5px;font-size:13px;color:#fff4df}#status{min-height:3em;color:#8ce6cc}#answers{font-size:14px}#review{padding:14px;border:1px solid #8ce6cc;border-radius:10px}#review[hidden],#input[hidden]{display:none}.tag{color:#ff8066;font-size:12px;letter-spacing:.15em}footer{font-size:13px;color:#a5b2cc;margin-top:22px}.coral{color:#ff8066}.mint{color:#8ce6cc}.gold{color:#ffd478}fieldset{border:0;margin:8px 0;padding:0}legend{font-size:14px;margin-bottom:5px}
</style><main><a href="../index.html">← アーケード</a><h1>記憶の設計図</h1><span class="tag">POSITION × SYMBOL × COLOR × ORDER</span><p>数字順に「場所・形・色」を記憶。盤面が隠れたら、形と色を選び、覚えた場所を順番に押して再現します。全5ラウンド。1つでも違えば終了です。</p><div class="controls"><label for="difficulty">難易度</label><select id="difficulty"><option value="0">初級・3×3</option><option value="1">中級・4×4</option><option value="2">上級・5×5</option></select><button id="start">記憶を始める</button></div><div class="stats"><span>ラウンド <strong id="round">—</strong></span><span>得点 <strong id="score">0</strong></span><span>最高 <strong id="best">0</strong></span><span>残り <strong id="timer">—</strong></span></div><p id="status" role="status" aria-live="polite">難易度を選んで「記憶を始める」を押してください。</p><div id="board" aria-label="記憶盤"></div><button id="ready" hidden>覚えた・回答へ</button><section id="input" hidden><fieldset><legend>形を選ぶ</legend><div class="palette" id="shapes"></div></fieldset><fieldset><legend>色を選ぶ（文字でも表示）</legend><div class="palette" id="colors"></div></fieldset><p id="answers"></p><div class="controls"><button id="undo">最後の回答を戻す</button><button id="submit">答え合わせ</button></div></section><section id="review" hidden><h2 id="result"></h2><p id="details"></p><button id="next">次のラウンド</button></section><p id="storage" hidden>この環境では最高得点を保存できません。</p><footer>Tab / Enter / Space で操作できます。回答時間に制限はありません。最高得点は難易度ごとにこの端末へ保存されます。</footer></main><script src="../pet-core.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),symbols=['●','▲','■','◆'],names=['丸','三角','四角','ひし形'],colors=['珊瑚','ミント','金'],classes=['coral','mint','gold'];let level=0,size=3,round=0,score=0,best=0,phase='idle',items=[],answers=[],shape=0,color=0,timer=null,deadline=0,passed=false,roundId='',roundPointer=null;const sessionBest={};function loadBest(){best=sessionBest[level]||0;try{const n=Number(localStorage.getItem('night-recall-best-'+level));if(Number.isSafeInteger(n)&&n>=0&&n<=100000)best=Math.max(best,n)}catch{$('storage').hidden=false}$('best').textContent=best}function storeBest(){if(score<=best)return;best=score;sessionBest[level]=best;try{localStorage.setItem('night-recall-best-'+level,best)}catch{$('storage').hidden=false}$('best').textContent=best}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function board(){const shown=phase==='study'||phase==='review';$('board').style.gridTemplateColumns=`repeat(${size},1fr)`;$('board').replaceChildren();for(let i=0;i<size*size;i++){const btn=document.createElement('button'),index=(shown?items:answers).findIndex(v=>v.pos===i),v=index<0?null:(shown?items:answers)[index];btn.type='button';btn.dataset.pos=i;btn.setAttribute('aria-disabled',String(phase!=='recall'||!!v));let label=`${Math.floor(i/size)+1}行 ${i%size+1}列`;if(v){btn.className=classes[v.color];btn.innerHTML=`<span class="order">${index+1}</span>${symbols[v.shape]}<small>${colors[v.color]}</small>`;label+=`、${index+1}番、${colors[v.color]}の${names[v.shape]}`}else{btn.textContent=phase==='recall'?'？':'·';label+=phase==='recall'?'、未回答':'、空き'}btn.setAttribute('aria-label',label);btn.onclick=()=>{if(phase!=='recall'||answers.length>=items.length||answers.some(v=>v.pos===i))return;answers.push({pos:i,shape,color});board();controls();$('board').children[i].focus()};$('board').append(btn)}}
function controls(){$('answers').textContent=`回答 ${answers.length} / ${items.length}：${answers.map((v,i)=>`${i+1}番 ${Math.floor(v.pos/size)+1}行${v.pos%size+1}列 ${colors[v.color]}の${names[v.shape]}`).join(' ／ ')}`;$('undo').disabled=!answers.length;$('submit').disabled=answers.length!==items.length;[...$('shapes').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===shape)));[...$('colors').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===color)))}
function beginRound(event){roundPointer=event?.detail>0?{x:event.clientX,y:event.clientY,until:performance.now()+350}:null;clearInterval(timer);phase='study';roundId=crypto.randomUUID();answers=[];shape=color=0;const count=2+level+round,positions=shuffle(Array.from({length:size*size},(_,i)=>i));items=positions.slice(0,count).map(pos=>({pos,shape:Math.floor(Math.random()*4),color:Math.floor(Math.random()*3)}));$('round').textContent=`${round} / 5`;$('score').textContent=score;$('input').hidden=true;$('review').hidden=true;$('ready').hidden=false;$('difficulty').disabled=true;$('start').textContent='最初から';$('status').textContent=`記憶タイム：${count}個の場所・形・色を数字の順番で覚えてください。`;deadline=Date.now()+(18-level*3+round)*1000;tick();timer=setInterval(tick,200);board()}
function tick(){if(phase!=='study')return;const seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=seconds+'秒';if(seconds===0)recall()}
function recall(event){if(phase!=='study')return;/* Ignore a second touch on the old next/retry button when ready moves underneath it. */if(event?.detail>0&&roundPointer&&performance.now()<roundPointer.until&&Math.hypot(event.clientX-roundPointer.x,event.clientY-roundPointer.y)<24)return;clearInterval(timer);phase='recall';$('timer').textContent='制限なし';$('ready').hidden=true;$('input').hidden=false;$('status').textContent='回答タイム：形と色を選び、1番から順番に場所を押してください。';board();controls();$('shapes').children[0].focus()}
function start(event){if(['study','recall'].includes(phase)&&!confirm('今の記憶ゲームを終了し、最初から始めますか？'))return;level=Number($('difficulty').value);size=3+level;round=1;score=0;loadBest();beginRound(event)}
$('start').onclick=start;$('ready').onclick=recall;$('undo').onclick=()=>{if(phase!=='recall')return;answers.pop();board();controls()};$('submit').onclick=()=>{if(phase!=='recall'||answers.length!==items.length)return;phase='review';const correct=items.map((v,i)=>v.pos===answers[i].pos&&v.shape===answers[i].shape&&v.color===answers[i].color);passed=correct.every(Boolean);if(passed)score+=items.length*100*(level+1);storeBest();$('score').textContent=score;$('input').hidden=true;$('review').hidden=false;$('result').textContent=passed?(round===5?'全5ラウンド達成！':'完全再現！'):'記憶が少し違いました';$('details').textContent=passed?`${items.length}個すべて正解。${round===5?'クリアです！':'次は記憶する数が1つ増えます。'}`:`${correct.filter(Boolean).length} / ${items.length}個が完全一致。不一致：${correct.map((v,i)=>v?null:(i+1)+'番').filter(Boolean).join('、')}。ゲーム終了。`;let rewardText='';const correctCount=correct.filter(Boolean).length;if(correctCount&&window.NightPet){const earned=window.NightPet.reward({game:'recall',id:roundId,coins:Math.min(30,correctCount*2),xp:Math.min(30,correctCount*2)});if(earned&&!earned.duplicate){rewardText=' お世話コイン +'+earned.coins+'！';if(earned.persistent===false)rewardText+=' 報酬を保存できませんでした。この画面の間だけ保持され、画面を閉じると失われます。'}}$('status').textContent='正解の設計図を表示しています。'+rewardText;$('timer').textContent='—';$('next').textContent=passed&&round<5?'次のラウンド':'もう一度';$('difficulty').disabled=passed&&round<5?true:false;board();$('next').focus()};$('next').onclick=event=>{if(phase!=='review')return;if(passed&&round<5){round++;beginRound(event)}else start(event)};$('difficulty').onchange=()=>{level=Number($('difficulty').value);loadBest()};symbols.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s+' '+names[i];b.onclick=()=>{shape=i;controls()};$('shapes').append(b)});colors.forEach((s,i)=>{const b=document.createElement('button');b.className=classes[i];b.textContent=s;b.onclick=()=>{color=i;controls()};$('colors').append(b)});loadBest();board();})();
</script></html>
